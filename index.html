<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Night Focus</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="focus.js"></script>
</head>
<body>
  <!-- Achtergrondvideo -->
  <video id="vid1" autoplay muted loop playsinline>
    <source src="234.mp4" type="video/mp4" />
  </video>

  <!-- Overlay SVG met portal -->
  <svg class="overlay">
    <defs>
      <clipPath id="mask">
        <circle id="mask-circle" cx="50%" cy="50%" r="15%" />
      </clipPath>
    </defs>

    <foreignObject clip-path="url(#mask)" x="0" y="0" width="100%" height="100%">
      <video id="vid2" autoplay muted loop playsinline>
        <source src="234.mp4" type="video/mp4" />
      </video>
    </foreignObject>

    <!-- Richtlijnen -->
    <g id="aimLines">
      <line x1="-2000" y1="0" x2="2000" y2="0" stroke="white" stroke-width="2" />
      <line x1="0" y1="-2000" x2="0" y2="2000" stroke="white" stroke-width="2" />
    </g>

    <!-- Cirkels -->
    <circle id="aimCircle1" cx="50%" cy="50%" r="15.5%" fill="none" stroke="white" stroke-width="2" stroke-dasharray="40 10" />
    <circle id="aimCircle2" cx="50%" cy="50%" r="16.5%" fill="none" stroke="white" stroke-width="3" stroke-dasharray="40 10" />
  </svg>

  <div class="overlay-fade"></div>
</body>
</html>
